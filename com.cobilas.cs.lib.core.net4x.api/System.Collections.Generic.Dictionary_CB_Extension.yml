  namespace: System.Collections.Generic
  summary: Searches for a key-value pair in the dictionary using a predicate for the key.
  remarks: >-
    This method iterates through the dictionary and returns the first key-value pair where the key satisfies the predicate.

    If no match is found, returns <code><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a>(<xref href="System.Collections.Generic.KeyValuePair%602" data-throw-if-not-resolved="false"></xref>)</code>, which typically has a default key and value.
  example: []
  syntax:
    content: 'public static KeyValuePair<Tkey, Tvalue> Find<Tkey, Tvalue>(this Dictionary<Tkey, Tvalue>? d, Predicate<Tkey>? predicate) where Tkey : notnull'
    parameters:
    - id: d
      type: System.Collections.Generic.Dictionary{{Tkey},{Tvalue}}
      description: The dictionary to search in.
    - id: predicate
      type: System.Predicate{{Tkey}}
      description: A function to test each key for a condition.
    typeParameters:
    - id: Tkey
      description: The type of keys in the dictionary.
    - id: Tvalue
      description: The type of values in the dictionary.
    return:
      type: System.Collections.Generic.KeyValuePair{{Tkey},{Tvalue}}
      description: The first key-value pair whose key matches the predicate, or a <code><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a>(<xref href="System.Collections.Generic.KeyValuePair%602" data-throw-if-not-resolved="false"></xref>)</code> if no match is found.
    content.vb: Public Shared Function Find(Of Tkey, Tvalue)(d As Dictionary(Of Tkey, Tvalue), predicate As Predicate(Of Tkey)) As KeyValuePair(Of Tkey, Tvalue)
  overload: System.Collections.Generic.Dictionary_CB_Extension.Find*
