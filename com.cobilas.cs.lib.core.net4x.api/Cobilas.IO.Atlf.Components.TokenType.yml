  namespace: Cobilas.IO.Atlf.Components
  summary: Represents the types of lexical tokens in the ATLF format.
  remarks: >-
    This enumeration defines all possible token types that can be generated by the ATLF lexer.

    Each token type corresponds to specific syntactic elements in the ATLF language.
  example: []
  syntax:
    content: 'public enum TokenType : byte'
    content.vb: Public Enum TokenType As Byte
