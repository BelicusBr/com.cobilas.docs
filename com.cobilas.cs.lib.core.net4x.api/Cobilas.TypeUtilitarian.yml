  summary: Checks if the type exists.
  remarks: This method compares the type's full name (including namespace) with the provided <code class="paramref">fullName</code>.
  example: []
  syntax:
    content: public static bool TypeExist(string fullName, string? assemblyName = null)
    parameters:
    - id: fullName
      type: System.String
      description: The full name of the type (e.g., <code>System.String</code>).
    - id: assemblyName
      type: System.String
      description: The full name of the assembly to search in. If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, all assemblies are searched.
    return:
      type: System.Boolean
      description: Returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> when the type exists; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
