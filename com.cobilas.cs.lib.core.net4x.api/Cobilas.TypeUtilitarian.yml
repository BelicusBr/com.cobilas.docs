  assemblies:
  - Cobilas.Core
  namespace: Cobilas
  summary: Get a specific type.
  remarks: This method searches for a type by its full name (including namespace). If not found, it returns the type of <xref href="Cobilas.NullObject.Null" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static Type GetType(string fullName, string? assemblyName = null)
    parameters:
    - id: fullName
      type: System.String
      description: The full name of the type (e.g., <code>System.String</code>).
    - id: assemblyName
      type: System.String
      description: The full name of the assembly to search in. If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, all assemblies are searched.
    return:
      type: System.Type
      description: >-
        Returns the type that was specified in the parameter.

        <p>If the specified type is not found, returns the <xref href="Cobilas.NullObject.Null" data-throw-if-not-resolved="false"></xref> type.</p>
    content.vb: Public Shared Function [GetType](fullName As String, assemblyName As String = Nothing) As Type
