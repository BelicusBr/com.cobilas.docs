  assemblies:
  - Cobilas.Core
  namespace: Cobilas
  summary: Get all types of assembly.
  remarks: >-
    When <code class="paramref">assemblyName</code> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, this method returns types from all loaded assemblies.

    Otherwise, it returns types only from the specified assembly.
  example: []
  syntax:
    content: public static Type[] GetTypes(string? assemblyName = null)
    parameters:
    - id: assemblyName
      type: System.String
      description: The full name of the assembly to get types from. If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, types from all assemblies are returned.
    return:
      type: System.Type[]
      description: Returns all types of objects from the specified assembly or from all assemblies.
    content.vb: Public Shared Function GetTypes(assemblyName As String = Nothing) As Type()
  overload: Cobilas.TypeUtilitarian.GetTypes*
  exceptions:
  - type: Cobilas.Exceptions.AssemblyNotFoundException
    commentId: T:Cobilas.Exceptions.AssemblyNotFoundException
    description: Thrown when the specified assembly name is not found.
  nameWithType.vb: TypeUtilitarian.GetTypes(String)
  fullName.vb: Cobilas.TypeUtilitarian.GetTypes(String)
