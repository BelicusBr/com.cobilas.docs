  assemblies:
  - com.cobilas.godot.lua
  namespace: Cobilas.GodotEngine.Lua
  summary: Represents the type codes for Lua values, combining CLR type codes with MoonSharp Lua-specific data types.
  remarks: >-
    This enumeration provides a unified type system that maps both standard CLR types

    and MoonSharp-specific Lua types to numeric codes for efficient type checking and conversion.
  example: []
  syntax:
    content: 'public enum LuaTypeCode : byte'
    content.vb: Public Enum LuaTypeCode As Byte
