  assemblies:
  - com.cobilas.godot.lua
  namespace: Cobilas.GodotEngine.Lua
  summary: Gets or sets a value indicating whether the Lua script should be automatically refreshed when the source file changes.
  remarks: >-
    When set to true, the script will automatically reload from the source file

    when changes are detected. This is useful during development when frequently

    modifying Lua scripts without restarting the application.
  example: []
  syntax:
    content: public bool RefreshLuaScript { get; set; }
    parameters: []
    return:
      type: System.Boolean
      description: True if the script should be refreshed on file changes; otherwise, false.
    content.vb: Public Property RefreshLuaScript As Boolean
  overload: Cobilas.GodotEngine.Lua.LuaScriptFile.RefreshLuaScript*
