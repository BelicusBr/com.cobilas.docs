  assemblies:
  - com.cobilas.godot.lua
  namespace: Cobilas.GodotEngine.Lua
  summary: Represents a Lua script loaded from a file with automatic refresh capabilities.
  remarks: >-
    This class provides file-based Lua script execution with optional automatic

    reloading when the source file changes. It inherits from <xref href="Cobilas.GodotEngine.Lua.LuaScript" data-throw-if-not-resolved="false"></xref> to provide

    full Lua scripting capabilities while adding file monitoring features.
  example: []
  syntax:
    content: 'public sealed class LuaScriptFile : LuaScript, IDisposable'
    content.vb: Public NotInheritable Class LuaScriptFile Inherits LuaScript Implements IDisposable
  inheritance:
  - System.Object
  - Cobilas.GodotEngine.Lua.LuaScript
  implements:
