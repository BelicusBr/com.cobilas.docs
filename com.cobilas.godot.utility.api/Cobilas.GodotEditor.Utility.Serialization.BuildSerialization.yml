  assemblies:
  - com.cobilas.godot.utility
  namespace: Cobilas.GodotEditor.Utility.Serialization
  summary: Builds a property manipulation interface for the specified Godot object.
  remarks: >-
    This method creates and caches property renderers for efficient property manipulation.

    Supported object types include <xref href="Godot.Node" data-throw-if-not-resolved="false"></xref> and <xref href="Godot.Resource" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static ISerializedPropertyManipulation? BuildObjectRender(Object? obj)
    parameters:
    - id: obj
      type: Godot.Object
      description: The Godot object to build the render for.
    return:
      type: Cobilas.GodotEditor.Utility.Serialization.ISerializedPropertyManipulation
      description: An <xref href="Cobilas.GodotEditor.Utility.Serialization.ISerializedPropertyManipulation" data-throw-if-not-resolved="false"></xref> interface for the object, or null if unsupported.
    content.vb: Public Shared Function BuildObjectRender(obj As [Object]) As ISerializedPropertyManipulation
